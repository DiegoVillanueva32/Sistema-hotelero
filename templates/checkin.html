{% extends 'base.html' %}
{% block title %}Check-in | Hotel Manager{% endblock %}
{% block content %}<div class="mx-auto max-w-2xl"><p class="text-sm font-semibold text-teal-400">INGRESO</p><h1 class="mt-1 text-3xl font-black">Registrar check-in</h1><form class="card mt-6 space-y-4 p-6" method="post"><label class="block text-sm text-slate-400">Habitación<select class="input-dark mt-2" name="habitacion" required>{% for h in habitaciones %}<option value="{{ h.id_habitacion }}">{{ h.id_habitacion }} - {{ h.tipo }} - {{ h.estado }}</option>{% endfor %}</select></label><label class="block text-sm text-slate-400">Nombre completo<input class="input-dark mt-2" name="nombre" required></label><label class="block text-sm text-slate-400">Documento<input class="input-dark mt-2" name="documento" required></label><label class="flex items-center gap-3 text-sm text-slate-300"><input type="checkbox" name="administrador" value="1" class="h-4 w-4"> Autorización administrativa antes de las 10:00</label><button class="btn w-full bg-teal-500 text-slate-950">Confirmar check-in</button></form></div>{% endblock %}
