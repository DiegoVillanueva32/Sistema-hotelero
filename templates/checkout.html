{% extends 'base.html' %}
{% block title %}Check-out | Hotel Manager{% endblock %}
{% block content %}<div class="mx-auto max-w-2xl"><p class="text-sm font-semibold text-rose-400">SALIDA</p><h1 class="mt-1 text-3xl font-black">Registrar check-out</h1><form class="card mt-6 space-y-4 p-6" method="post"><label class="block text-sm text-slate-400">Habitación ocupada<select class="input-dark mt-2" name="habitacion" required>{% for h in habitaciones %}<option value="{{ h.id_habitacion }}">{{ h.id_habitacion }} - {{ h.huesped_nombre }}</option>{% endfor %}</select></label><button class="btn w-full bg-rose-500 text-white">Confirmar salida</button></form></div>{% endblock %}
