{% extends 'base.html' %}
{% block title %}Check-out | Hotel Manager{% endblock %}
{% block content %}<div class="mx-auto max-w-3xl"><p class="text-sm font-semibold text-rose-400">SALIDA</p><h1 class="mt-1 text-3xl font-black">Check-out y extensión de estancia</h1><div class="mt-6 grid gap-6 md:grid-cols-2"><form class="card space-y-4 p-6" method="post"><input type="hidden" name="accion" value="checkout"><label class="block text-sm text-slate-400">Habitación ocupada<select class="input-dark mt-2" name="habitacion" required><option value="" disabled {% if not habitacion_seleccionada %}selected{% endif %}>Selecciona una habitación</option>{% for h in habitaciones %}<option value="{{ h.id_habitacion }}" {% if habitacion_seleccionada == h.id_habitacion|string %}selected{% endif %}>{{ h.id_habitacion }} - {{ h.huesped_nombre }}</option>{% endfor %}</select></label><button class="btn w-full bg-rose-500 text-white">Confirmar salida</button></form><form class="card space-y-4 p-6" method="post"><input type="hidden" name="accion" value="extender"><label class="block text-sm text-slate-400">Habitación ocupada<select class="input-dark mt-2" name="habitacion" required>{% for h in habitaciones %}<option value="{{ h.id_habitacion }}" {% if habitacion_seleccionada == h.id_habitacion|string %}selected{% endif %}>{{ h.id_habitacion }} - {{ h.huesped_nombre }}</option>{% endfor %}</select></label><label class="block text-sm text-slate-400">Noches adicionales<input class="input-dark mt-2" name="noches" type="number" min="1" value="1" required></label><button class="btn w-full bg-violet-500 text-white">Extender estancia</button></form></div></div>{% endblock %}
